name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Aurora (pinned) and apply Galaxy PC patches
        shell: bash
        run: |
          git clone https://github.com/encounter/aurora.git extern/aurora
          cd extern/aurora
          git checkout 3227d76
          git submodule update --init --recursive
          git apply ../../patches/aurora-dvd-directory.patch

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        shell: cmd
        run: cmake --build build --target galaxy -- -k 0

      - name: Package
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp build/SuperMarioGalaxy.exe dist/ || true
          find build -maxdepth 3 -name "*.dll" -exec cp {} dist/ \; || true
          cp README-PC.txt dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SuperMarioGalaxy-windows
          path: dist/
